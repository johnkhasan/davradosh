# Puzzle: api.puzzle.javohir.ru and rtc.puzzle.javohir.ru
#
# Appended to /srv/hsbch/nginx.conf, the single config mounted into the shared
# hsbch-nginx-1 container. Port 80 is handled by the catch-all block there
# (ACME challenge from /var/www/certbot, redirect to https). The certificate
# (both names) is copied to /srv/hsbch/certs/puzzle.javohir.ru by the certbot
# deploy hook.

# api.puzzle.javohir.ru -> puzzle-server:4000 (REST, Socket.IO, uploads)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.puzzle.javohir.ru;

    ssl_certificate     /etc/nginx/certs/puzzle.javohir.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/puzzle.javohir.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Image uploads (the app enforces 10 MB per file).
    client_max_body_size 12m;

    # Resolved at request time through Docker's embedded DNS, so the server
    # container can be replaced without reloading nginx.
    resolver 127.0.0.11 valid=10s;

    access_log /var/log/nginx/puzzle.access.log;
    error_log  /var/log/nginx/puzzle.error.log;

    location /socket.io/ {
        set $upstream_puzzle puzzle-server:4000;
        proxy_pass http://$upstream_puzzle$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Game sessions are long-lived WebSockets.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        set $upstream_puzzle puzzle-server:4000;
        proxy_pass http://$upstream_puzzle$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}

# rtc.puzzle.javohir.ru -> LiveKit signalling (host network, bridge gateway)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rtc.puzzle.javohir.ru;

    ssl_certificate     /etc/nginx/certs/puzzle.javohir.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/puzzle.javohir.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/puzzle-rtc.access.log;
    error_log  /var/log/nginx/puzzle-rtc.error.log;

    location / {
        proxy_pass http://172.18.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
