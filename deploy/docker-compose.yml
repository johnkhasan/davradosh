# Production stack on the VPS (/srv/puzzle). The web app runs on Vercel.
#   docker compose pull && docker compose up -d
#
# TLS and routing are done by the VPS's shared nginx (hsbch-nginx-1), which
# reaches the game server as `puzzle-server:4000` on the shared proxy network
# and LiveKit's signalling on the Docker bridge gateway (see nginx/puzzle.conf).
name: puzzle

services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/johnkhasan/puzzle-server:latest}
    container_name: puzzle-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      UPLOAD_DIR: /app/uploads
      # Uploaded images are served by the app (immutable, CORS-readable).
      SERVE_UPLOADS: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The site moved to davradosh.uz; puzzle.javohir.ru and previews stay allowed via .env.
      CORS_ORIGINS: ${CORS_ORIGINS},https://davradosh.uz,https://www.davradosh.uz
    volumes:
      - /srv/puzzle/uploads:/app/uploads
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:16-alpine
    container_name: puzzle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  # Voice and video (SFU): host network for the UDP port range. Signalling
  # listens on 127.0.0.1 and the proxy network's gateway only (livekit.yaml).
  livekit:
    image: livekit/livekit-server:v1.13
    container_name: puzzle-livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  default:
  # The shared reverse proxy's network (hsbch-nginx-1).
  proxy:
    name: ${PROXY_NETWORK:-hsbch_default}
    external: true

volumes:
  pg_data:
